# Prometheus 설정
# Chapter 3: 데이터 파이프라인 모니터링

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL 메트릭 (postgres_exporter 사용 시)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    # 실제 환경에서는 postgres_exporter 사용

  # Kafka 메트릭 (JMX exporter 사용 시)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    # 실제 환경에서는 kafka_exporter 또는 JMX exporter 사용

  # 애플리케이션 메트릭
  - job_name: 'application'
    static_configs:
      - targets: []
    # 애플리케이션 메트릭 엔드포인트 추가
