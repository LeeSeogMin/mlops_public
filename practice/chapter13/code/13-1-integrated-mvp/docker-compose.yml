# 13주차 통합 실습: 통합 MVP — 수집(ingester) → Kafka → 처리(processor) → 모델 API
#
# 3장 로컬 스택의 Kafka·Zookeeper 구성을 재사용하되, 3장 compose와 공존하도록
# Kafka·Zookeeper의 호스트 포트는 공개하지 않는다(컨테이너 네트워크 내부 전용).
# 호스트에 노출되는 것은 모델 API(8014) 하나 — 나머지 연결은 전부 내부 네트워크다.
name: ch13-mvp

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 내부 리스너 하나만 둔다 — 호스트에서 브로커에 직접 붙을 일이 없다(축소 설계)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 토픽은 ingester가 파티션 수를 명시해 만든다 — 자동 생성이 단일 파티션
      # 전제(마감 순서 보장)를 조용히 깨지 못하게 막는다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-api:
    build: ./model-api
    image: ch13-model-api
    ports:
      - "8014:8000"

  processor:
    build: ./pipeline
    image: ch13-pipeline
    command: ["python", "-u", "processor.py"]
    depends_on:
      kafka:
        condition: service_healthy
      model-api:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: complaints.raw
      MODEL_API: http://model-api:8000
    volumes:
      - ../../data/input:/data/in:ro
      - ../../data/output/mvp:/data/out

  # 단발 실행 전용(오케스트레이터가 docker compose run으로 호출) — up 대상이 아니다
  # 빌드 선언은 processor 한 곳에만 둔다: 같은 태그를 두 서비스가 병렬 빌드하면
  # "image already exists" 경합으로 빌드가 깨진다(이 장 실제 오류 — 14.5)
  ingester:
    image: ch13-pipeline
    entrypoint: ["python", "-u", "ingester.py"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: complaints.raw
    volumes:
      - ../../data/input:/data/in:ro
